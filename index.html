<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <meta name="description" content="Um convite interativo feito especialmente para você.">
    <title>Tenho uma coisinha pra te perguntar...</title>
    <link rel="stylesheet" href="style.css?v=6">
    <script src="config.js?v=3" defer></script>
    <script src="script.js?v=6" defer></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb--one"></span>
      <span class="orb orb--two"></span>
      <span class="orb orb--three"></span>
      <div class="sparkles" id="sparkles"></div>
    </div>

    <main class="app-shell">
      <header class="topbar" id="topbar" hidden>
        <button class="back-button" id="backButton" type="button" aria-label="Voltar para a etapa anterior">
          <span aria-hidden="true">←</span>
          <span>Voltar</span>
        </button>
        <div class="progress-wrap">
          <div class="progress-copy">
            <span id="progressLabel">Começando...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Progresso do convite" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="progress-bar" id="progressBar"></span>
          </div>
        </div>
      </header>

      <section class="experience" id="experience" aria-live="polite" aria-atomic="false">
        <div class="boot-state">
          <span class="loader" aria-hidden="true"></span>
          <p>Preparando uma coisinha especial...</p>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>

    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <noscript>
      <div class="noscript">Este convite precisa do JavaScript ativado para funcionar.</div>
    </noscript>
  </body>
</html>
